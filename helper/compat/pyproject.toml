# One-release distribution shim for existing plugin dependency declarations.
[project]
name = "krobi-lyrics"
version = "0.15.11"
description = "Compatibility package for krobi-helper (one release)"
requires-python = ">=3.10"
dependencies = ["krobi-helper==0.15.11"]
license = { text = "AGPL-3.0-or-later" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["krobi_lyrics"]

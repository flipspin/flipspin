name: Build desktop app

# Reused by release.yml; the manual button also builds an installer without
# cutting a release.
on:
  workflow_call:
    inputs:
      platform:
        type: string
        required: true
      release:
        description: Use the release environment (Apple secrets are read only on macOS)
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      platform:
        description: Which installer to build
        type: choice
        required: true
        default: macos
        options:
          - macos
          - windows
          - linux

concurrency:
  group: build-${{ github.ref }}-${{ inputs.platform }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: ${{ inputs.platform }} installer
    runs-on: ${{ inputs.platform == 'linux' && 'ubuntu-22.04' || inputs.platform == 'windows' && 'windows-latest' || 'macos-latest' }}
    environment: ${{ inputs.release && inputs.platform == 'macos' && 'release' || 'build' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate platform and macOS architecture
        shell: bash
        env:
          PLATFORM: ${{ inputs.platform }}
        run: |
          case "$PLATFORM" in
            macos) test "$(uname -m)" = arm64 ;;
            windows|linux) ;;
            *) echo '::error::platform must be macos, windows or linux'; exit 1 ;;
          esac

      # Keep the Linux baseline at 22.04 (glibc 2.35). Match ci.yml's shell
      # libraries, plus AppImage tooling and the codecs WebKit needs for audio.
      - name: Install the Linux build dependencies
        if: inputs.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libssl-dev libxdo-dev build-essential \
            curl wget file pkg-config patchelf libfuse2 xdg-utils \
            gstreamer1.0-tools gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav

      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          toolchain: stable
          rustflags: ""
          cache: false
        if: inputs.platform == 'linux'

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      # scripts/build-backend.cjs invokes PyInstaller from the repo-root .venv by
      # absolute path, so the venv has to live exactly here and carry the full
      # requirements.txt (which is what pins pyinstaller).
      - name: Create the backend venv
        shell: bash
        run: |
          python -m venv .venv
          if [ -d .venv/Scripts ]; then PY=.venv/Scripts/python.exe; else PY=.venv/bin/python; fi
          "$PY" -m pip install --upgrade pip
          "$PY" -m pip install -r backend/requirements.txt

      - name: Install Node dependencies
        run: npm ci

      - name: Installer version
        id: version
        shell: bash
        run: node -p '"version=" + require("./package.json").version' >> "$GITHUB_OUTPUT"

      - name: Test Linux packaging paths
        if: inputs.platform == 'linux'
        run: node --test scripts/linux-packaging.test.cjs

      - name: Build the installer
        shell: bash
        env:
          PLATFORM: ${{ inputs.platform }}
          APPLE_CERTIFICATE: ${{ inputs.platform == 'macos' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ inputs.platform == 'macos' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ inputs.platform == 'macos' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_API_ISSUER: ${{ inputs.platform == 'macos' && secrets.APPLE_API_ISSUER || '' }}
          APPLE_API_KEY: ${{ inputs.platform == 'macos' && secrets.APPLE_API_KEY || '' }}
          APPLE_API_KEY_CONTENTS: ${{ inputs.platform == 'macos' && secrets.APPLE_API_KEY_PATH || '' }}
        run: |
          if [ "$PLATFORM" = "windows" ]; then
            npm run dist:win
          elif [ "$PLATFORM" = "linux" ]; then
            npm run dist:linux
          else
            signing=unsigned
            if [ -n "$APPLE_CERTIFICATE" ] && [ -n "$APPLE_CERTIFICATE_PASSWORD" ] && \
               [ -n "$APPLE_SIGNING_IDENTITY" ] && [ -n "$APPLE_API_ISSUER" ] && \
               [ -n "$APPLE_API_KEY" ] && [ -n "$APPLE_API_KEY_CONTENTS" ]; then
              # Tauri's CLI uses the imported identity and the path to the .p8.
              # Never print credential values or enable shell tracing here.
              keychain="$RUNNER_TEMP/krobi-signing.keychain-db"
              export APPLE_API_KEY_PATH="$RUNNER_TEMP/krobi-api-key.p8"
              certificate="$RUNNER_TEMP/krobi-certificate.p12"
              trap 'security delete-keychain "$keychain" >/dev/null 2>&1 || true; rm -f "$certificate" "$APPLE_API_KEY_PATH"' EXIT
              umask 077
              python - <<'PY'
          import base64, os
          from pathlib import Path
          Path(os.environ['RUNNER_TEMP'], 'krobi-certificate.p12').write_bytes(base64.b64decode(os.environ['APPLE_CERTIFICATE'], validate=True))
          Path(os.environ['APPLE_API_KEY_PATH']).write_text(os.environ['APPLE_API_KEY_CONTENTS'])
          PY
              keychain_password=$(openssl rand -hex 32)
              security create-keychain -p "$keychain_password" "$keychain" >/dev/null 2>&1
              security set-keychain-settings -lut 21600 "$keychain" >/dev/null 2>&1
              security unlock-keychain -p "$keychain_password" "$keychain" >/dev/null 2>&1
              security import "$certificate" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security >/dev/null 2>&1
              security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" >/dev/null 2>&1
              security list-keychains -d user -s "$keychain" login.keychain-db >/dev/null 2>&1
              signing=signed
            else
              # An incomplete secret set also builds unsigned. Never attempt
              # partial signing or silently fall back after a signing failure.
              unset APPLE_SIGNING_IDENTITY APPLE_API_ISSUER APPLE_API_KEY APPLE_API_KEY_PATH
            fi
            unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_API_KEY_CONTENTS
            npm run dist:mac
            printf '%s\n' "$signing" > "$RUNNER_TEMP/macos-signing.txt"
          fi

      - name: Verify all requested installer formats exist
        shell: bash
        env:
          PLATFORM: ${{ inputs.platform }}
        run: |
          shopt -s nullglob
          bundle=src-tauri/target/release/bundle
          case "$PLATFORM" in
            macos) files=("$bundle"/dmg/*.dmg); test "${#files[@]}" -gt 0 ;;
            windows) files=("$bundle"/nsis/*.exe); test "${#files[@]}" -gt 0 ;;
            linux)
              files=("$bundle"/appimage/*.AppImage); test "${#files[@]}" -gt 0
              files=("$bundle"/deb/*.deb); test "${#files[@]}" -gt 0
              ;;
          esac

      - name: What landed in the bundle directory
        shell: bash
        run: ls -laR src-tauri/target/release/bundle || true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: krobi-${{ inputs.platform }}-${{ steps.version.outputs.version }}
          if-no-files-found: error
          retention-days: 14
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb

      - name: Upload macOS signing status
        if: inputs.platform == 'macos'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-macos-signing
          if-no-files-found: error
          retention-days: 14
          path: ${{ runner.temp }}/macos-signing.txt

[project]
name = "krobi-helper"
version = "0.15.11"
description = "KROBI's MLX/CUDA/CPU engine: lyrics (vocal isolation, transcription, alignment), stems (separation, beats, chops), as one command the backend drives."
requires-python = ">=3.10"
license = { text = "AGPL-3.0-or-later" }
dependencies = ["numpy"]

[project.optional-dependencies]
engine = [
  "demucs-mlx[convert]>=1.4.6; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "torch>=2.6",
  "torchaudio>=2.6",
  "demucs>=4.1.0",
  "beat-this>=1.1",
  "soundfile>=0.12",
  "huggingface_hub>=0.25",
  "numpy",
]
analysis = ["onnxruntime>=1.18", "krobi-keyfinder==1.0.0"]
# Transcription stays optional and is not offered by the v1 installer.
transcription = [
  "mlx-whisper>=0.4.3; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "openai-whisper>=20240930; sys_platform != 'darwin' or platform_machine != 'arm64'",
  "torch>=2.6", "torchaudio>=2.6",
]
stems = [
  "demucs-mlx[convert]>=1.4.6; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "demucs>=4.1.0",
  "beat-this>=1.1", "soundfile>=0.12",
]
# Also permits a forced-CPU measurement on an Apple Silicon machine.
portable = ["demucs>=4.1.0", "openai-whisper>=20240930"]

[project.scripts]
krobi-helper = "krobi_helper.cli:main"
# One-release command alias.
krobi-lyrics = "krobi_helper.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["krobi_helper"]

[tool.pytest.ini_options]
pythonpath = [".", "compat"]

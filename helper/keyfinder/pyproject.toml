[project]
name = "krobi-keyfinder"
version = "1.0.0"
description = "Krobi's libKeyFinder bridge with all 24 key scores"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-or-later AND GPL-3.0-or-later" }

[build-system]
requires = ["scikit-build-core>=0.10"]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
wheel.packages = ["krobi_keyfinder"]
install.components = ["python"]

[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-*"
skip = "*-musllinux_* *-win32 *-manylinux_i686"
test-requires = ["numpy", "pytest"]
test-command = "pytest {project}/tests"

[tool.cibuildwheel.macos]
archs = ["arm64"]
environment = { MACOSX_DEPLOYMENT_TARGET = "11.0" }

[tool.cibuildwheel.linux]
archs = ["x86_64", "aarch64"]

[tool.cibuildwheel.windows]
archs = ["AMD64"]
